<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f3">
    <title>Origin — Mortgage workspace</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" data-view="overview" aria-label="Origin home">
          <span class="brand-mark" aria-hidden="true">o</span>
          <span>origin<span class="brand-period">.</span></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="nav-list">
          <button class="nav-item active" type="button" data-view="overview">
            <span class="nav-icon" aria-hidden="true">⌂</span> Overview
          </button>
          <button class="nav-item" type="button" data-view="applications">
            <span class="nav-icon" aria-hidden="true">▤</span> Application &amp; Pre-qualification
            <span class="nav-count" id="nav-count">0</span>
          </button>
          <button class="nav-item" type="button" data-view="processing">
            <span class="nav-icon" aria-hidden="true">◷</span> Processing
          </button>
          <button class="nav-item" type="button" data-view="underwriting">
            <span class="nav-icon" aria-hidden="true">◈</span> Underwriting
          </button>
          <button class="nav-item" type="button" data-view="closing">
            <span class="nav-icon" aria-hidden="true">▣</span> Closing
          </button>
          <button class="nav-item" type="button" data-view="funding">
            <span class="nav-icon" aria-hidden="true">↗</span> Funding
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="prototype-note">
            <span class="note-dot"></span>
            <div><strong>Prototype workspace</strong><small>Data is held in memory only</small></div>
          </div>
          <div class="user-chip">
            <span class="avatar">LO</span>
            <span><strong>Loan officer</strong><small>Residential mortgage</small></span>
            <span class="user-menu" aria-hidden="true">···</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-right"><span class="secure-label"><span aria-hidden="true">◆</span> Demo environment</span><span class="top-avatar">LO</span></div>
        </header>
        <div id="app" class="page-container" aria-live="polite"></div>
        <footer class="page-footer">
          <span>Origin <span aria-hidden="true">·</span> Mortgage origination workspace</span>
          <span>URLA-aligned prototype <span aria-hidden="true">·</span> Not for real applicant data</span>
        </footer>
      </main>
    </div>
  </body>
</html>
